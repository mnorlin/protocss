name: Verify

on:
  push:
    branches: ["main"]

env:
  CSS_FILENAME: protocss.min.css

jobs:
  verify:
    name: Build CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Minimize CSS
        run: npm run build:css
