<!doctype html>
<html lang="en">
  <load src="/app/head.html" />
  <body>
    <load src="/app/header.html" />

    <main id="main" class="container">
      <hgroup>
        <h1>Select</h1>
      </hgroup>

      <div>
        <h2>Single select</h2>
        <proto-code preview>
          <label>
            Select an option
            <select>
              <option>Option 1</option>
              <option>Option 2</option>
              <option>Option 3</option>
            </select>
          </label>
        </proto-code>
      </div>

      <div>
        <h2>Multi select</h2>
        <proto-code preview>
          <label>
            Select many option
            <select multiple size="3">
              <option>Option 1</option>
              <option>Option 2</option>
              <option>Option 3</option>
            </select>
            <small class="mt-1">Hold <kbd>ctrl</kbd> to select multiple</small>
          </label>
        </proto-code>
      </div>
