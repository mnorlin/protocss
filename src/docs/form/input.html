    <main class="container">
      <div>
        <h1>Input</h1>
      </div>

      <div>
        <h2>Input</h2>
        <proto-code preview>
          <form class="space-y-gap">
            <div>
              <label>
                Regular
                <input type="text" aria-describedby="form-text" />
              </label>
              <div id="form-text">This is some help text to the input</div>
            </div>

            <div>
              <label>
                Invalid
                <input aria-invalid="true" aria-describedby="error-text" />
              </label>
              <span id="error-text">
                This help text can be used to give details about the input error
              </span>
            </div>
            <!--
            <label>
              Disabled
              <input disabled type="text" />
            </label>-->
          </form>
        </proto-code>
      </div>
