<!doctype html>
<html lang="en">
  <load src="/app/head.html" />
  <body>
    <load src="/app/header.html" />
    <load src="/app/aside.html" />
    <main id="main" class="container">
      <hgroup>
        <h1>Tooltip</h1>
        <p>Show some descriptive text when hovering or focusing on an element</p>
      </hgroup>

      <div>
        Place the tooltip
        <strong>immediately</strong> after the element that should have the tooltip. Link
        them together via <code>aria-describedby</code> and <code>id</code>.
        <proto-code preview>
          <button aria-describedby="tip-save">Save</button>
          <div role="tooltip" id="tip-save">Saves your progress</div>
        </proto-code>
      </div>
    </main>
  </body>
</html>
