<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProtoCSS</title>
  <link rel="stylesheet" href="/styles/index.css" />
  <script type="module" src="/index.js"></script>
  <style>
    .container {
      margin: 0 auto;
      width: 100%;
      max-width: 800px;
    }

    body > header {
      display: flex;
      position: sticky;
      top: 0;
      justify-content: space-between;
      z-index: 100;
      backdrop-filter: blur(5px);
      background-color: oklch(from var(--color-base) l c h / 50%);

      button {
        box-shadow: none;
      }

      [popover] {
        margin-inline-end: 0;
        margin-block-start: 4px;
        inset-block-start: anchor(bottom);
        inset-inline-end: anchor(inline-end);
        box-shadow: var(--interactive-shadow-lg);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        padding: 16px;
        width: 400px;
      }
    }

    body > aside {
      border-inline-end: 1px solid var(--color-border);
      padding: var(--space-3) var(--space-5);
      min-width: 200px;

      menu menu {
        border-inline-start: 1px solid var(--color-contrast-2);

        li {
          margin: 0;
          margin-inline-start: -1px;
        }
      }

      a {
        border-inline-start: 1px solid transparent;
        padding: var(--space-1) var(--space-3);
        color: var(--color-contrast-4);
        font-size: 0.9em;
        text-decoration: none;

        &:hover {
          border-color: var(--color-contrast-3);
          color: var(--color-contrast-6);
        }
        &[aria-current="page"] {
          border-color: var(--color-contrast);
          color: var(--color-contrast-6);
          font-weight: bold;
        }
      }

      menu {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        margin: var(--space-3) 0 var(--space-8) 0;
        padding: 0;
        list-style: none;
        strong {
          display: block;
          color: var(--color-contrast-4);
          font-size: var(--font-small);
          text-transform: uppercase;
        }
      }
    }

    #desktop-menu {
      display: none;
    }

    #mobile-menu {
      display: block;
      transform: translateX(-100%);
      transition:
        transform 0.2s,
        overlay 0.2s ease-out;
      inset: unset;
      inset-block-start: 0;
      inset-inline-start: 0;
      border: none;
      background: var(--color-base);
      width: fit-content;
      min-width: 250px;
      height: 100dvh;

      &:popover-open {
        transform: translateX(0);
      }

      &::backdrop {
        backdrop-filter: blur(1px);
        background-color: rgb(0 0 0 / 0.8);
      }
    }

    @media (width >= 720px) {
      #desktop-menu {
        display: block;
      }

      #menu-open-button {
        display: none;
      }
    }

    [dir="rtl"] {
      #mobile-menu {
        display: block;
        transform: translateX(100%);

        &:popover-open {
          transform: translateX(0%);
        }
      }
    }
  </style>
  <style id="config">
    /* Injected theme config */
  </style>
</head>
