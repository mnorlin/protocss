<header>
  <div class="space-x-gap" style="align-items: center">
    <button
      id="menu-open-button"
      class="reset"
      popovertarget="mobile-menu"
      aria-label="Main menu"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="1em"
        height="16em"
        fill="currentColor"
        class="bi bi-list"
        style="vertical-align: -0.125em"
        viewBox="0 0 16 16"
      >
        <path
          fill-rule="evenodd"
          d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
        />
      </svg>
    </button>
    <div class="h3 mb-0" style="color: var(--color-primary)">ProtoCSS</div>
    <div
      style="
        font-size: var(--font-small, 0.75rem);
        color: var(--color-danger-3, red);
        padding: var(--space-1) var(--space-2);
        border-radius: var(--border-radius);
        border: 1px solid var(--color-danger-3);
        background-color: var(--color-danger-1);
        font-weight: bold;
        margin-left: calc(-1 * var(--space-3));
      "
    >
      BETA VERSION
    </div>
  </div>
  <button aria-label="Open theme config" popovertarget="theme-config">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="1em"
      height="1em"
      fill="currentColor"
      class="bi bi-palette2"
      viewBox="0 0 16 16"
      style="vertical-align: -0.125em"
    >
      <path
        d="M0 .5A.5.5 0 0 1 .5 0h5a.5.5 0 0 1 .5.5v5.277l4.147-4.131a.5.5 0 0 1 .707 0l3.535 3.536a.5.5 0 0 1 0 .708L10.261 10H15.5a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5H3a3 3 0 0 1-2.121-.879A3 3 0 0 1 0 13.044m6-.21 7.328-7.3-2.829-2.828L6 7.188zM4.5 13a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0M15 15v-4H9.258l-4.015 4zM0 .5v12.495zm0 12.495V13z"
      />
    </svg>
  </button>
  <proto-config
    configId="config"
    id="theme-config"
    popover
    style="background-color: var(--color-base)"
  ></proto-config>
</header>
