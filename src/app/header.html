<header>
  <div class="space-x-gap" style="align-items: center">
    <button
      id="menu-open-button"
      class="reset"
      popovertarget="mobile-menu"
      aria-label="Main menu"
    >
      <i class="bi bi-list"></i>
    </button>
    <div class="h3 mb-0" style="color: var(--color-primary)">ProtoCSS</div>
    <div
      style="
        font-size: var(--font-small);
        color: white;
        padding: var(--space-1) var(--space-2);
        border-radius: var(--border-radius);
        background-color: var(--color-danger);
        font-weight: bold;
        margin-left: calc(-1 * var(--space-3));
      "
    >
      BETA VERSION
    </div>
  </div>
  <button popovertarget="theme-config"><i class="bi bi-palette2"></i></button>
  <proto-config configId="config" id="theme-config" popover></proto-config>
</header>
